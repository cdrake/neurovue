[package]
name = "neurovue"
version = "0.1.0"
description = "NeuroVue desktop viewer"
edition = "2021"
license = "BSD-2-Clause"
# tauri dev runs the window, not neurovue-cli
default-run = "neurovue"

[lib]
name = "neurovue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# neurovue-cli builds only with --features cli, so tauri's bundler (which copies
# every enabled bin) leaves it out of the app.
[features]
cli = []

[[bin]]
name = "neurovue-cli"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.7"
base64 = "0.22"
# NiiVue saves documents (.nvd) as CBOR by default.
ciborium = "0.2"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
# The receive tokens; the OS generator on every platform, Windows included.
getrandom = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Single-file `.nvbundle` (a zip). default-features off + deflate keeps it pure
# Rust (no bzip2/zstd C deps) so it cross-compiles to iOS.
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
# Apple Pencil double-tap, squeeze and haptics on iPad; empty elsewhere.
tauri-plugin-pencil = { path = "plugins/pencil" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the axum router in tests without binding a port.
tower = { version = "0.5", features = ["util"] }

# The integrated terminal (PTY/shell) is desktop-only: iOS/Android forbid
# spawning subprocesses, so its dependency is excluded from mobile builds.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
portable-pty = "0.8"

# Native share sheet (src/share.rs) — Apple platforms. macOS uses AppKit's
# NSSharingService; iOS uses UIKit's UIActivityViewController.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# poll() for Bonjour discovery (src/bonjour.rs).
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSSharingService"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", features = [
  "block2",
  "UIActivityViewController",
  "UIActivity",
  "UIApplication",
  "UIResponder",
  "UIWindow",
  "UIViewController",
  "UIView",
  "UIPopoverPresentationController",
] }
