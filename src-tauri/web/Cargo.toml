[package]
name = "neurovue-web"
version = "0.2.3"
edition = "2021"
description = "NeuroVue in a browser (Neurodesk); no Tauri"
publish = false

[[bin]]
name = "neurovue-web"
path = "src/main.rs"

# Same versions as ../Cargo.toml: the dataset server source is shared.
[dependencies]
axum = "0.7"
base64 = "0.22"
ciborium = "0.2"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
