name: neurovue
version: 0.2.2

architectures:
  - x86_64

copyright:
  - license: BSD-2-Clause
    url: https://github.com/cdrake/neurovue/blob/main/LICENSE

domains:
  - neuroimaging
categories:
  - visualization

icon: data:image/png;base64,

auto_update:
  method: github_release
  repo: cdrake/neurovue

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - environment:
        DEBIAN_FRONTEND: noninteractive

    - install:
        - ca-certificates
        - curl

    - workdir: /opt

    - run:
        - tar -xzf {{ get_file("neurovue_web_tar") }} -C /opt
        - mv /opt/neurovue-web-{{ context.version }}-linux-x86_64 /opt/neurovue
        - chmod +x /opt/neurovue/neurovue-web

    - copy: neurovue /usr/local/bin/neurovue

    - run:
        - chmod +x /usr/local/bin/neurovue

deploy:
  bins:
    - neurovue
  webapp:
    title: NeuroVue
    icon: icon.svg
    startup_command: "neurovue start"
    startup_timeout: 60
    description: "View NIfTI brain volumes and BIDS datasets in the browser"
    port: 8090

readme: |
  ----------------------------------
  ## neurovue/{{ context.version }} ##

  NeuroVue is a viewer for NIfTI brain volumes and BIDS datasets, rendered
  with NiiVue (WebGL2, with WebGPU where available). This container runs its
  web version: a small server that serves the viewer UI and the volumes you
  open, which you browse from the server's file picker.

  Example:
  ```
  neurovue start
  ```

  This serves NeuroVue on `127.0.0.1:${NEURODESK_WEBAPP_PORT}` when set,
  otherwise on port `8090`. It listens on localhost only and has no
  authentication; anyone who can reach that port can read files this user
  can. The last opened dataset is remembered in `~/.cache/neurovue` and
  reopened on the next start.

  More documentation can be found here: https://github.com/cdrake/neurovue

  To run container outside of this environment: ml neurovue/{{ context.version }}

  ----------------------------------

files:
  - name: neurovue_web_tar
    url: https://github.com/cdrake/neurovue/releases/download/v{{ context.version }}/neurovue-web-{{ context.version }}-linux-x86_64.tar.gz
    sha256: bbbe4e5f4403f843d0254bc8ea75caafe66648150fd2384528184bfbc38c94b9

  - name: neurovue
    contents: |
      #!/usr/bin/env bash
      set -euo pipefail
      case "${1:-start}" in
        start)
          [ "$#" -gt 0 ] && shift
          exec /opt/neurovue/neurovue-web \
            --bind "127.0.0.1:${NEURODESK_WEBAPP_PORT:-8090}" \
            --dist /opt/neurovue/dist-web "$@"
          ;;
        --version|version)
          exec /opt/neurovue/neurovue-web --version
          ;;
        *)
          echo "usage: neurovue [start [--dataset PATH]] | neurovue --version" >&2
          exit 2
          ;;
      esac
